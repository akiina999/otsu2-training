<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">純物質の模式的な加熱曲線</title><desc id="desc">横軸が時間、縦軸が温度。区間Aで上昇、区間Bで温度が一定、区間Cで再び上昇する。</desc><rect width="640" height="360" fill="white"/><line x1="80" y1="300" x2="590" y2="300" stroke="#222" stroke-width="3"/><line x1="80" y1="300" x2="80" y2="45" stroke="#222" stroke-width="3"/><polyline points="105,275 245,175 405,175 555,75" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><text x="155" y="245" font-family="sans-serif" font-size="28">A</text><text x="315" y="155" font-family="sans-serif" font-size="28">B</text><text x="475" y="135" font-family="sans-serif" font-size="28">C</text><text x="525" y="335" font-family="sans-serif" font-size="22">時間</text><text x="25" y="70" font-family="sans-serif" font-size="22">温度</text></svg>