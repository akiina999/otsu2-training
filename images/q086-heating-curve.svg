<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">加熱曲線の模式図</title><desc id="desc">時間の経過に対し温度が上昇し、途中で一定温度の水平部分を示した後、再び上昇するグラフ</desc><rect width="720" height="420" fill="#fff"/><line x1="90" y1="340" x2="650" y2="340" stroke="#222" stroke-width="3"/><line x1="90" y1="340" x2="90" y2="55" stroke="#222" stroke-width="3"/><text x="610" y="380" font-size="24" font-family="sans-serif">時間</text><text x="28" y="75" font-size="24" font-family="sans-serif">温度</text><polyline points="110,310 260,205 445,205 610,90" fill="none" stroke="#2f6f9f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="205" r="6" fill="#2f6f9f"/><circle cx="445" cy="205" r="6" fill="#2f6f9f"/><text x="300" y="180" font-size="24" font-family="sans-serif">一定温度</text><text x="118" y="300" font-size="21" font-family="sans-serif">固体の温度上昇</text><text x="455" y="145" font-size="21" font-family="sans-serif">液体の温度上昇</text></svg>