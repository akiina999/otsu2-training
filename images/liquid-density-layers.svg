<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">液体Aと液体Bの二層</title><desc id="desc">透明な容器の中で液体Aが上層、液体Bが下層に分かれている模式図</desc><rect width="640" height="420" fill="#f8fafc"/><text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1f2937">互いに混ざらない2種類の液体</text><path d="M170 80 L190 350 Q192 380 225 380 H415 Q448 380 450 350 L470 80" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round"/><rect x="190" y="112" width="260" height="116" fill="#dbeafe"/><rect x="198" y="228" width="244" height="144" fill="#fde68a"/><line x1="190" y1="228" x2="450" y2="228" stroke="#334155" stroke-width="4"/><text x="320" y="180" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1e3a8a">液体A</text><text x="320" y="308" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#78350f">液体B</text><text x="490" y="168" font-family="sans-serif" font-size="22" fill="#334155">上層</text><text x="490" y="300" font-family="sans-serif" font-size="22" fill="#334155">下層</text><path d="M458 160 H485" stroke="#64748b" stroke-width="3"/><path d="M450 292 H485" stroke="#64748b" stroke-width="3"/></svg>