<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>危険物乙2トレーニング</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:820px;margin:30px auto;padding:16px;line-height:1.65;background:#f6f7f9;color:#222}h1{font-size:1.8rem}.card{background:#fff;border:1px solid #d8dce2;border-radius:12px;padding:22px;margin-top:18px;box-shadow:0 3px 12px #0000000d}.hidden{display:none!important}button,select{font:inherit;padding:10px 16px;margin:6px 4px;cursor:pointer}.choice{display:block;width:100%;text-align:left;margin:9px 0}.result-title{font-size:1.25rem;font-weight:700}.review-item{padding:9px 4px;border-bottom:1px solid #eee}.status{min-height:1.7em;font-weight:700}.detail{background:#f2f5f8;border-radius:8px;padding:12px;margin:10px 0}.key-help{font-size:.92rem;color:#555}.danger{border-color:#b33}</style></head><body><h1>危険物乙2トレーニング</h1><section id="startScreen" class="card"><h2>スタート</h2><label>出題数 <select id="questionCount"><option value="10" selected>10問</option><option value="20">20問</option><option value="30">30問</option><option value="50">50問</option></select></label><div><button id="startButton" type="button">開始（Enter）</button><button id="openReviewButton" type="button">復習候補を見る</button></div><p class="key-help">Enter：開始</p></section><section id="quizScreen" class="card hidden"><h2 id="progress"></h2><p id="questionText"></p><div id="choices"></div><button id="unknownButton" type="button">わからない（W）</button><button id="quitButton" type="button">途中終了（トップへ戻る）</button><p class="key-help">1〜5：回答 / W：わからない</p></section><section id="resultScreen" class="card hidden"><div id="resultTitle" class="result-title"></div><p id="answerInfo"></p><p id="explanation"></p><div id="detailBox" class="detail"></div><p id="categoryInfo"></p><p id="sourceInfo" class="key-help"></p><button id="bookmarkButton" type="button">あとで復習（R）</button><button id="nextButton" type="button">次の問題へ（Enter）</button><p id="bookmarkStatus" class="status" aria-live="polite"></p><p class="key-help">Enter：次へ / R：あとで復習</p></section><section id="reviewScreen" class="card hidden"><h2>復習候補</h2><p id="reviewCount"></p><p id="reviewStatus" class="status" aria-live="polite"></p><div id="reviewList"></div><div><button id="selectAllButton" type="button">全選択</button><button id="clearAllChecksButton" type="button">全解除</button></div><div><button id="startReviewButton" type="button">選択した問題を復習</button><button id="deleteSelectedButton" type="button" onclick="deleteSelected()">選択削除</button><button id="deleteUncheckedButton" type="button" onclick="deleteUnchecked()">非選択を削除</button></div><div><button id="deleteAllButton" class="danger" type="button" onclick="deleteAll()">すべて削除</button><button id="reviewTopButton" type="button">トップへ戻る</button></div></section><script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script><script src="questions-5.js"></script><script src="app.js"></script></body></html>
